<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | بارکاو</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='barkav_report_192.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    <meta name="theme-color" content="#0F172A">
</head>
<body>
<div class="auth">
    <form class="auth-card" method="post" action="{{ url_for('login') }}">
        <img src="{{ url_for('static', filename='barkav_report_512.png') }}" alt="BARKAV">
        <h1>بارکاو</h1>
        <p>سامانه ثبت گزارش روزانه کارگاه. برای ادامه رمز را وارد کنید.</p>
        <div class="field">
            <label for="password">رمز ورود</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary">ورود</button>
        {% if error %}
        <div class="error-text">{{ error }}</div>
        {% endif %}
    </form>
</div>
</body>
</html>
